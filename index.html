            // ========== 模式切换 ==========
            async function switchMode(mode) {
                if (mode === currentMode) return;
                await saveAll();
                if (currentMode === 'section') {
                    await saveCurrentSectionPage();
                    await dbPut(STORE_DATA, 'section_pages', sectionPages);
                }
                currentMode = mode;
                const data = await loadMode(mode);
                if (!data) {
                    if (mode === 'cover') modeData.cover = { ...defaultCoverData };
                    else if (mode === 'toc') modeData.toc = { ...defaultTocData };
                    else if (mode === 'ending') modeData.ending = { ...defaultEndingData };
                    else if (mode === 'section') {
                        modeData.section = { headerText: '天津xxxx公司', footerTags: [...defaultEndingData.footerTags] };
                        if (sectionPages.length === 0) {
                            const newId = genId();
                            sectionPages = [{ id: newId, data: { ...defaultSectionPageData } }];
                            await dbPut(STORE_SECTION, newId, sectionPages[0]);
                            activeSectionPageId = newId;
                        }
                    }
                }
                renderSlide();
                const dlBtn = $('downloadPptxBtn');
                if (dlBtn) {
                    if (mode === 'section') dlBtn.textContent = '📥 下载PPTX（全部页面）';
                    else dlBtn.textContent = '📥 下载PPTX';
                }
            }

            // ========== 大纲视图 ==========
            $('openOutlineBtn').addEventListener('click', function() {
                const mode = currentMode;
                let text = '';
                if (mode === 'cover') {
                    const d = modeData.cover || defaultCoverData;
                    text = `[页眉]${d.headerText||''}\n[主标题]${d.mainTitle||''}\n[副标题]${d.subTitle||''}\n`;
                    (d.tags || defaultCoverData.tags).forEach(t => text += `[标签]${t}\n`);
                    (d.footerTags || defaultCoverData.footerTags).forEach(t => text += `[页脚标签]${t}\n`);
                } else if (mode === 'toc') {
                    const d = modeData.toc || defaultTocData;
                    text =
                    `[页眉]${d.headerText||''}\n[目录中文]${d.tocTitleCn||''}\n[目录英文]${d.tocTitleEn||''}\n`;
                    (d.tocCards || defaultTocData.tocCards).forEach(c => text += `[章节:${c.num},${c.cn},${c.en}]\n`);
                    (d.footerTags || defaultTocData.footerTags).forEach(t => text += `[页脚标签]${t}\n`);
                } else if (mode === 'ending') {
                    const d = modeData.ending || defaultEndingData;
                    text =
                    `[页眉]${d.headerText||''}\n[主标题]${d.endingMain||''}\n[副标题]${d.endingSub||''}\n[电话]${d.phoneText||''}\n[邮箱]${d.emailText||''}\n`;
                    (d.footerTags || defaultEndingData.footerTags).forEach(t => text += `[页脚标签]${t}\n`);
                } else if (mode === 'section') {
                    const d = modeData.section || {};
                    const page = getActiveSectionPage();
                    text = `[页眉]${d.headerText||''}\n[标号]${page?.data?.number||''}\n[主标题]${page?.data?.main||''}\n[子标题]${page?.data?.sub||''}\n`;
                    (d.footerTags || defaultEndingData.footerTags).forEach(t => text += `[页脚标签]${t}\n`);
                }
                $('outlineTextarea').value = text;
                $('outlineModal').classList.add('active');
                hidePicker();
            });

            $('cancelOutlineBtn').addEventListener('click', () => $('outlineModal').classList.remove('active'));
            $('applyOutlineBtn').addEventListener('click', function() {
                const text = $('outlineTextarea').value;
                const mode = currentMode;
                const lines = text.split('\n');
                const result = {};
                const tags = [];
                const footerTags = [];
                let tocCards = [];
                let sectionData = {};

                for (const line of lines) {
                    const l = line.trim();
                    if (l.startsWith('[页眉]')) result.headerText = l.substring(4).trim();
                    else if (l.startsWith('[主标题]')) {
                        if (mode === 'cover' || mode === 'ending') result.mainTitle = l.substring(5).trim();
                    } else if (l.startsWith('[副标题]')) {
                        if (mode === 'cover' || mode === 'ending') result.subTitle = l.substring(5).trim();
                    } else if (l.startsWith('[标签]')) tags.push(l.substring(4).trim());
                    else if (l.startsWith('[页脚标签]')) footerTags.push(l.substring(6).trim());
                    else if (l.startsWith('[目录中文]')) result.tocTitleCn = l.substring(6).trim();
                    else if (l.startsWith('[目录英文]')) result.tocTitleEn = l.substring(6).trim();
                    else if (l.startsWith('[章节:')) {
                        const inner = l.substring(4).trim();
                        const parts = inner.split(',');
                        if (parts.length >= 3) tocCards.push({ num: parts[0].trim(), cn: parts[1].trim(), en: parts[2]
                                .trim() });
                    } else if (l.startsWith('[电话]')) result.phoneText = l.substring(4).trim();
                    else if (l.startsWith('[邮箱]')) result.emailText = l.substring(4).trim();
                    else if (l.startsWith('[标号]')) sectionData.number = l.substring(4).trim();
                    else if (l.startsWith('[子标题]')) sectionData.sub = l.substring(5).trim();
                }

                if (mode === 'cover') {
                    const d = modeData.cover || { ...defaultCoverData };
                    if (result.headerText !== undefined) d.headerText = result.headerText;
                    if (result.mainTitle !== undefined) d.mainTitle = result.mainTitle;
                    if (result.subTitle !== undefined) d.subTitle = result.subTitle;
                    if (tags.length) d.tags = tags;
                    if (footerTags.length) d.footerTags = footerTags;
                    modeData.cover = d;
                    renderSlide();
                    debounceSaveAll();
                    showToast('大纲已应用', 'success');
                } else if (mode === 'toc') {
                    const d = modeData.toc || { ...defaultTocData };
                    if (result.headerText !== undefined) d.headerText = result.headerText;
                    if (result.tocTitleCn !== undefined) d.tocTitleCn = result.tocTitleCn;
                    if (result.tocTitleEn !== undefined) d.tocTitleEn = result.tocTitleEn;
                    if (tocCards.length) d.tocCards = tocCards;
                    if (footerTags.length) d.footerTags = footerTags;
                    modeData.toc = d;
                    renderSlide();
                    debounceSaveAll();
                    showToast('大纲已应用', 'success');
                } else if (mode === 'ending') {
                    const d = modeData.ending || { ...defaultEndingData };
                    if (result.headerText !== undefined) d.headerText = result.headerText;
                    if (result.mainTitle !== undefined) d.endingMain = result.mainTitle;
                    if (result.subTitle !== undefined) d.endingSub = result.subTitle;
                    if (result.phoneText !== undefined) d.phoneText = result.phoneText;
                    if (result.emailText !== undefined) d.emailText = result.emailText;
                    if (footerTags.length) d.footerTags = footerTags;
                    modeData.ending = d;
                    renderSlide();
                    debounceSaveAll();
                    showToast('大纲已应用', 'success');
                } else if (mode === 'section') {
                    const d = modeData.section || { headerText: '天津xxxx公司', footerTags: [...defaultEndingData
                            .footerTags] };
                    if (result.headerText !== undefined) d.headerText = result.headerText;
                    if (footerTags.length) d.footerTags = footerTags;
                    const page = getActiveSectionPage();
                    if (page) {
                        if (sectionData.number !== undefined) page.data.number = sectionData.number;
                        if (sectionData.sub !== undefined) page.data.sub = sectionData.sub;
                        if (result.mainTitle !== undefined) page.data.main = result.mainTitle;
                    }
                    modeData.section = d;
                    renderSlide();
                    debounceSaveAll();
                    showToast('大纲已应用', 'success');
                }
                $('outlineModal').classList.remove('active');
            });

            // ========== 下载PPTX ==========
            $('downloadPptxBtn').addEventListener('click', async function() {
                if (isGeneratingPptx) return;
                isGeneratingPptx = true;
                const btn = this;
                btn.disabled = true;
                btn.textContent = '⏳ 生成中...';
                hidePicker();
                document.querySelectorAll('[contenteditable="true"]').forEach(el => el.blur());
                await saveAll();
                if (currentMode === 'section') await saveCurrentSectionPage();

                try {
                    const pptx = new PptxGenJS();
                    pptx.layout = 'LAYOUT_WIDE';

                    if (currentMode === 'section') {
                        const allPages = [...sectionPages];
                        const origActive = activeSectionPageId;
                        for (let i = 0; i < allPages.length; i++) {
                            const page = allPages[i];
                            activeSectionPageId = page.id;
                            applySectionPageData(page.data);
                            autoFitSectionFonts();
                            await new Promise(r => setTimeout(r, 300));
                            const canvas = await html2canvas($('slideOuter'), { scale: 2, useCORS: true,
                                allowTaint: true, backgroundColor: null, logging: false });
                            pptx.addSlide().addImage({ data: canvas.toDataURL('image/png'), x: 0, y: 0, w: '100%',
                                h: '100%' });
                        }
                        const origPage = sectionPages.find(p => p.id === origActive);
                        if (origPage) { activeSectionPageId = origActive;
                            applySectionPageData(origPage.data);
                            autoFitSectionFonts(); }
                        await pptx.writeFile({ fileName: 'PPT章节过渡页_全部_高清导出.pptx' });
                        showToast('全部 ' + allPages.length + ' 页导出成功！', 'success');
                    } else {
                        const canvas = await html2canvas($('slideOuter'), { scale: 3, useCORS: true,
                            allowTaint: true, backgroundColor: null, logging: false });
                        pptx.addSlide().addImage({ data: canvas.toDataURL('image/png'), x: 0, y: 0, w: '100%',
                            h: '100%' });
                        const names = { cover: '封面页', toc: '目录页', ending: '结束页', section: '章节过渡页' };
                        await pptx.writeFile({ fileName: `PPT${names[currentMode]||'页面'}_高清导出.pptx` });
                        showToast('下载成功！', 'success');
                    }
                } catch (e) {
                    console.error(e);
                    showToast('导出失败：' + e.message, 'error');
                }
                isGeneratingPptx = false;
                btn.disabled = false;
                btn.textContent = currentMode === 'section' ? '📥 下载PPTX（全部页面）' : '📥 下载PPTX';
            });

            // ========== 重置 ==========
            $('resetDataBtn').addEventListener('click', async function() {
                if (!confirm('确定恢复默认数据？当前修改将丢失。')) return;
                await dbPut(STORE_DATA, currentMode, null);
                if (currentMode === 'section') {
                    for (const p of sectionPages) await dbDelete(STORE_SECTION, p.id);
                    sectionPages = [];

                location.reload();

                if (e.key === 'Escape') { hidePicker();

                if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault();
                    $('downloadPptxBtn').click(); }
            });

            document.querySelectorAll('.mode-tab').forEach(tab => {

            // ========== 初始化 ==========
            async function init() {
                await openDB();
                const coverData = await loadMode('cover');
                const tocData = await loadMode('toc');
                const endingData = await loadMode('ending');
                const sectionData = await loadMode('section');
                const sectionPagesData = await dbGet(STORE_DATA, 'section_pages');

                if (!coverData) modeData.cover = { ...defaultCoverData };
                if (!tocData) modeData.toc = { ...defaultTocData };
                if (!endingData) modeData.ending = { ...defaultEndingData };
                if (!sectionData) modeData.section = { headerText: '天津xxxx公司', footerTags: [...defaultEndingData
                        .footerTags] };

                if (sectionPagesData && sectionPagesData.length) {
                    sectionPages = sectionPagesData;
                } else {
                    const newId = genId();
                    sectionPages = [{ id: newId, data: { ...defaultSectionPageData } }];
                    await dbPut(STORE_SECTION, newId, sectionPages[0]);
                }
                activeSectionPageId = sectionPages[0].id;

                setRootVar('--header-top', '32px');
                setRootVar('--footer-bottom', '32px');
                setRootVar('--header-size', '14px');
                setRootVar('--footer-size', '13px');
                setRootVar('--header-color', '#8896a8');
                setRootVar('--footer-tag-color', '#8896a8');
                setRootVar('--footer-tag-gap', '10px');

                currentMode = 'cover';
                renderSlide();
                if (!coverData) await saveAll();

                console.log('🚀 PPT全页面编辑器已启动 | 支持封面/目录/结束/章节四种模式');
            }

            init();
