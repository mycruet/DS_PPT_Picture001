<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深空科技 · PPT全页面编辑器</title>
    <style>
        /* ===== 全局基础样式 ===== */
        :root {
            --deep-space: #080d1a;
            --obsidian: #0c1119;
            --titanium-silver: #a8b4c2;
            --titanium-dim: #7b8899;
            --accent-blue: #5b9bd5;
            --text-primary: #e4e9f0;
            --text-secondary: #bcc5d1;
            --glass-bg-panel: rgba(18, 26, 42, 0.65);
            --glass-blur: 18px;
            --slide-width: 960px;
            --slide-padding-h: 50px;
            --header-top: 32px;
            --footer-bottom: 32px;
            --header-size: 14px;
            --footer-size: 13px;
            --header-color: #8896a8;
            --footer-tag-color: #8896a8;
            --footer-tag-gap: 10px;
            --footer-tag-size: 13px;
            --font-en: 'Times New Roman', 'Times', 'Georgia', serif;
            --font-cn-title: 'Source Han Sans SC', 'HarmonyOS Sans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            --font-cn-body: 'Source Han Sans SC', 'HarmonyOS Sans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            --font-mixed: 'Times New Roman', 'Source Han Sans SC', 'HarmonyOS Sans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: radial-gradient(ellipse at 25% 20%, rgba(30, 60, 110, 0.35) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 65%, rgba(20, 50, 90, 0.28) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 80%, rgba(10, 30, 60, 0.40) 0%, transparent 50%),
                linear-gradient(175deg, #080d1a 0%, #0c1320 30%, #0a101c 60%, #0e1624 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            gap: 22px;
            user-select: none;
            position: relative;
        }
        /* ===== Toast ===== */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .toast {
            pointer-events: auto;
            background: rgba(22, 34, 55, 0.88);
            backdrop-filter: blur(16px) saturate(1.6);
            border: 1px solid rgba(180, 200, 220, 0.18);
            border-radius: 10px;
            padding: 10px 20px;
            color: #e0e6f0;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.4px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            animation: toastIn 0.35s ease-out, toastOut 0.35s ease-in 1.8s forwards;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toast.success {
            border-color: rgba(100, 200, 150, 0.4);
        }
        .toast.warning {
            border-color: rgba(240, 180, 80, 0.5);
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes toastOut {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(-16px);
            }
        }
        /* ===== 应用容器 ===== */
        .app-container {
            display: flex;
            gap: 22px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            max-width: 1500px;
            width: 100%;
            position: relative;
            z-index: 1;
        }
        .slide-wrapper {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .slide-label {
            font-size: 12px;
            color: #8896a8;
            letter-spacing: 0.6px;
            font-weight: 500;
            text-transform: uppercase;
        }
        /* ===== 模式切换标签 ===== */
        .mode-tabs-bar {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background: rgba(18, 26, 42, 0.55);
            backdrop-filter: blur(8px);
            border-radius: 8px;
            border: 1px solid rgba(180, 200, 220, 0.10);
            flex-wrap: wrap;
            max-width: var(--slide-width);
            overflow-x: auto;
            z-index: 5;
            margin-bottom: 4px;
        }
        .mode-tab {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.3px;
            white-space: nowrap;
            border: 1.5px solid transparent;
            background: rgba(25, 38, 58, 0.45);
            color: #8896a8;
            transition: all 0.2s;
            font-family: 'Segoe UI', 'PingFang SC', sans-serif;
        }
        .mode-tab:hover {
            background: rgba(35, 50, 72, 0.60);
            color: #bcc5d1;
            border-color: rgba(180, 200, 220, 0.18);
        }
        .mode-tab.active {
            background: rgba(60, 130, 200, 0.30);
            border-color: rgba(140, 190, 225, 0.35);
            color: #e0e6f0;
            box-shadow: 0 0 14px rgba(70, 140, 210, 0.18);
            font-weight: 600;
        }
        .mode-tab .tab-icon {
            font-size: 14px;
        }
        /* ===== 幻灯片外框 ===== */
        .slide-outer {
            width: var(--slide-width);
            aspect-ratio: 16 / 9;
            background: var(--obsidian);
            border-radius: 0;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(180, 200, 225, 0.10);
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }
        .slide {
            width: 100%;
            height: 100%;
            position: relative;
            font-family: var(--font-mixed);
            color: var(--text-primary);
            overflow: hidden;
        }
        .slide-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse at 30% 40%, rgba(30, 60, 110, 0.5) 0%, transparent 55%),
                radial-gradient(ellipse at 70% 55%, rgba(20, 50, 100, 0.35) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(15, 40, 80, 0.40) 0%, transparent 45%),
                linear-gradient(180deg, #0c1420 0%, #0e1725 35%, #0b1522 65%, #0d1622 100%);
        }
        .slide-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 30%, rgba(80, 140, 210, 0.12) 0%, transparent 30%),
                radial-gradient(circle at 75% 45%, rgba(60, 120, 190, 0.10) 0%, transparent 28%),
                radial-gradient(circle at 40% 70%, rgba(70, 130, 200, 0.08) 0%, transparent 25%);
            pointer-events: none;
        }
        .slide-geo {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0.35;
        }
        .slide-content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: var(--header-top) var(--slide-padding-h) var(--footer-bottom);
        }
        /* ===== 页眉/页脚 ===== */
        .page-header {
            flex-shrink: 0;
            text-align: left;
            min-height: 22px;
        }
        .header-text {
            font-size: var(--header-size);
            color: var(--header-color);
            cursor: text;
            outline: none;
            font-family: var(--font-cn-body);
            font-weight: 400;
            letter-spacing: 0.5px;
            display: inline-block;
            white-space: nowrap;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .header-text:empty::before {
            content: '页眉文本...';
            color: rgba(180, 195, 215, 0.35);
            pointer-events: none;
        }
        .page-footer {
            flex-shrink: 0;
            display: flex;
            justify-content: flex-end;
            gap: var(--footer-tag-gap);
            flex-wrap: wrap;
            align-items: center;
            min-height: 22px;
        }
        .footer-tag-item {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 4px 12px;
            font-size: var(--footer-tag-size);
            color: var(--footer-tag-color);
            font-family: var(--font-cn-body);
            font-weight: 350;
            letter-spacing: 0.3px;
            white-space: nowrap;
            cursor: default;
            box-sizing: border-box;
            position: relative;
            text-align: center;
            border: none;
            background: none;
        }
        .footer-tag-item .footer-tag-delete {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            color: #e06060;
            background: rgba(0, 0, 0, 0.4);
            border: none;
            z-index: 5;
            pointer-events: auto;
        }
        .footer-tag-item:hover .footer-tag-delete {
            opacity: 0.85;
        }
        /* ===== 属性面板 ===== */
        .props-panel {
            flex: 0 0 380px;
            background: var(--glass-bg-panel);
            backdrop-filter: blur(var(--glass-blur)) saturate(1.4);
            border-radius: 14px;
            border: 1px solid rgba(200, 215, 235, 0.10);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            padding: 22px 18px;
            font-size: 13px;
            max-height: 85vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: sticky;
            top: 20px;
            z-index: 20;
            color: #d0d8e2;
            font-family: 'Segoe UI', 'PingFang SC', sans-serif;
            min-width: 340px;
        }
        .props-panel::-webkit-scrollbar {
            width: 5px;
        }
        .props-panel::-webkit-scrollbar-thumb {
            background: rgba(180, 200, 220, 0.18);
            border-radius: 6px;
        }
        .props-panel h3 {
            font-size: 15px;
            font-weight: 650;
            color: #e0e6f0;
            margin: 0;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(200, 215, 235, 0.10);
        }
        .props-panel h4 {
            font-size: 12.5px;
            font-weight: 600;
            color: #c5d0dd;
            margin: 0 0 4px;
        }
        .prop-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 9px 11px;
            background: rgba(22, 34, 55, 0.40);
            border-radius: 9px;
            border: 1px solid rgba(180, 200, 220, 0.06);
            backdrop-filter: blur(4px);
        }
        .prop-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
            flex-wrap: wrap;
        }
        .prop-row label {
            font-size: 11px;
            color: #b0bcc9;
            white-space: nowrap;
            font-weight: 450;
            min-width: 48px;
        }
        .prop-row input[type="number"] {
            width: 56px;
            padding: 4px 6px;
            border: 1px solid rgba(180, 200, 220, 0.18);
            border-radius: 5px;
            font-size: 11px;
            text-align: center;
            background: rgba(15, 25, 42, 0.60);
            color: #d0d8e2;
            outline: none;
            font-family: inherit;
        }
        .prop-row input[type="color"] {
            width: 28px;
            height: 22px;
            border: 1px solid rgba(180, 200, 220, 0.20);
            border-radius: 4px;
            cursor: pointer;
            padding: 1px;
            background: rgba(15, 25, 42, 0.50);
        }
        .prop-row select {
            padding: 4px 6px;
            border: 1px solid rgba(180, 200, 220, 0.18);
            border-radius: 5px;
            font-size: 11px;
            background: rgba(15, 25, 42, 0.60);
            color: #d0d8e2;
            outline: none;
            cursor: pointer;
            font-family: inherit;
        }
        .toggle-switch {
            position: relative;
            width: 38px;
            height: 20px;
            flex-shrink: 0;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(100, 120, 150, 0.45);
            border-radius: 20px;
            transition: 0.3s;
        }
        .toggle-slider::before {
            content: '';
            position: absolute;
            height: 14px;
            width: 14px;
            left: 2px;
            bottom: 2px;
            background: #d5dde6;
            border-radius: 50%;
            transition: 0.3s;
        }
        .toggle-switch input:checked+.toggle-slider {
            background: rgba(75, 140, 210, 0.70);
            box-shadow: 0 0 12px rgba(70, 140, 210, 0.25);
        }
        .toggle-switch input:checked+.toggle-slider::before {
            transform: translateX(16px);
            background: #fff;
        }
        .info-tag {
            font-size: 9.5px;
            color: #8896a8;
            background: rgba(20, 32, 50, 0.50);
            padding: 2px 7px;
            border-radius: 9px;
            white-space: nowrap;
            font-family: 'SF Mono', 'Consolas', 'Menlo', monospace;
        }
        .btn {
            padding: 7px 13px;
            border: 1px solid rgba(180, 200, 220, 0.15);
            border-radius: 6px;
            cursor: pointer;
            font-size: 11.5px;
            font-weight: 500;
            letter-spacing: 0.3px;
            backdrop-filter: blur(6px);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            justify-content: center;
            font-family: inherit;
        }
        .btn-primary {
            background: rgba(60, 130, 200, 0.40);
            color: #e8eef6;
            border-color: rgba(140, 190, 225, 0.25);
        }
        .btn-download {
            background: rgba(45, 180, 130, 0.38);
            color: #e0f5ed;
            border-color: rgba(100, 210, 170, 0.30);
            font-weight: 600;
            font-size: 12.5px;
            padding: 9px 16px;
        }
        .btn-outline {
            background: rgba(20, 32, 50, 0.45);
            border: 1.5px solid rgba(180, 200, 220, 0.16);
            color: #c5d0dd;
        }
        .btn-sm {
            padding: 4px 8px;
            font-size: 10px;
            border-radius: 4px;
        }
        .btn-danger {
            background: rgba(200, 60, 60, 0.30);
            color: #e8d0d0;
            border-color: rgba(200, 80, 80, 0.25);
        }
        .btn-danger:hover {
            background: rgba(200, 60, 60, 0.45);
        }
        .selected-text-indicator {
            font-size: 10px;
            color: #7db8e0;
            display: none;
            align-items: center;
            gap: 4px;
        }
        .selected-text-indicator.active {
            display: flex;
        }
        .indicator-dot {
            width: 6px;
            height: 6px;
            background: #7db8e0;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(120, 180, 220, 0.6);
        }
        /* ===== 浮动颜色选择器 ===== */
        .floating-color-picker {
            position: fixed;
            z-index: 5000;
            background: rgba(20, 30, 48, 0.92);
            backdrop-filter: blur(14px) saturate(1.6);
            border: 1px solid rgba(180, 200, 220, 0.20);
            border-radius: 10px;
            padding: 10px 12px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
            display: none;
            flex-direction: column;
            gap: 8px;
            min-width: 170px;
            pointer-events: auto;
            animation: popIn 0.2s ease-out;
        }
        .floating-color-picker.active {
            display: flex;
        }
        @keyframes popIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .floating-color-picker .preset-colors {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .floating-color-picker .preset-swatch {
            width: 22px;
            height: 22px;
            border-radius: 5px;
            cursor: pointer;
            border: 1.5px solid rgba(200, 215, 235, 0.20);
            transition: transform 0.15s;
            flex-shrink: 0;
        }
        .floating-color-picker .preset-swatch:hover {
            transform: scale(1.18);
            border-color: rgba(220, 235, 250, 0.55);
        }
        .floating-color-picker .picker-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .floating-color-picker .picker-row label {
            font-size: 10px;
            color: #b0bcc9;
        }
        .floating-color-picker .picker-row input[type="color"] {
            width: 28px;
            height: 24px;
            border: 1px solid rgba(180, 200, 220, 0.22);
            border-radius: 4px;
            cursor: pointer;
            background: rgba(15, 25, 42, 0.50);
        }
        .floating-color-picker .btn-reset-color {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid rgba(180, 200, 220, 0.15);
            background: rgba(30, 42, 60, 0.50);
            color: #c5d0dd;
        }
        /* ===== 模态框 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(4, 8, 18, 0.70);
            backdrop-filter: blur(6px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-dialog {
            background: rgba(18, 28, 46, 0.80);
            backdrop-filter: blur(22px) saturate(1.5);
            border-radius: 14px;
            padding: 26px;
            width: 92%;
            max-width: 720px;
            max-height: 82vh;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid rgba(200, 215, 235, 0.10);
        }
        .modal-dialog textarea {
            flex-grow: 1;
            min-height: 300px;
            font-family: 'SF Mono', 'Consolas', 'Menlo', monospace;
            font-size: 13px;
            padding: 14px;
            border: 1px solid rgba(180, 200, 220, 0.18);
            border-radius: 8px;
            background: rgba(12, 20, 34, 0.65);
            color: #d0d8e2;
            resize: vertical;
            outline: none;
            white-space: pre-wrap;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        /* ===== 章节页多页面管理 ===== */
        .page-tabs-bar {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background: rgba(18, 26, 42, 0.55);
            backdrop-filter: blur(8px);
            border-radius: 8px;
            border: 1px solid rgba(180, 200, 220, 0.10);
            flex-wrap: wrap;
            max-width: var(--slide-width);
            overflow-x: auto;
            z-index: 5;
            margin-bottom: 4px;
        }
        .page-tab {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.3px;
            white-space: nowrap;
            border: 1.5px solid transparent;
            background: rgba(25, 38, 58, 0.45);
            color: #8896a8;
            transition: all 0.2s;
            font-family: 'Segoe UI', 'PingFang SC', sans-serif;
            position: relative;
        }
        .page-tab:hover {
            background: rgba(35, 50, 72, 0.60);
            color: #bcc5d1;
            border-color: rgba(180, 200, 220, 0.18);
        }
        .page-tab.active {
            background: rgba(60, 130, 200, 0.30);
            border-color: rgba(140, 190, 225, 0.35);
            color: #e0e6f0;
            box-shadow: 0 0 14px rgba(70, 140, 210, 0.18);
            font-weight: 600;
        }
        .page-tab .tab-delete {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            color: #e06060;
            margin-left: 2px;
            flex-shrink: 0;
        }
        .page-tab:hover .tab-delete {
            opacity: 0.7;
        }
        .page-tab .tab-delete:hover {
            opacity: 1;
            background: rgba(220, 80, 80, 0.20);
        }
        .btn-add-page {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            border: 1.5px dashed rgba(180, 200, 220, 0.22);
            background: rgba(25, 38, 58, 0.35);
            color: #8896a8;
            transition: all 0.25s;
            flex-shrink: 0;
        }
        .btn-add-page:hover {
            background: rgba(45, 180, 130, 0.25);
            border-color: rgba(100, 210, 170, 0.40);
            color: #c0e8d8;
            box-shadow: 0 0 16px rgba(50, 180, 130, 0.15);
        }
        /* ===== 各页面专属样式 ===== */
        /* 封面 */
        .center-group {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            gap: var(--group-gap, 14px);
            padding: 20px 0;
        }
        .main-title {
            font-size: var(--main-title-size, 38px);
            font-weight: 700;
            color: var(--main-title-color, #eef2f8);
            cursor: text;
            outline: none;
            font-family: var(--font-cn-title);
            letter-spacing: 0.6px;
            white-space: nowrap;
            display: inline-block;
            max-width: 100%;
            text-shadow: 0 0 30px rgba(180, 210, 240, 0.12);
            line-height: 1.2;
        }

    <script>
        (function() {
            'use strict';

            // ========== 工具函数 ==========
            const $ = (s) => document.getElementById(s);
            const qs = (el, s) => el.querySelector(s);
            const qsa = (el, s) => el.querySelectorAll(s);

            function showToast(m, t = 'info') {
                const e = document.createElement('div');
                e.className = 'toast ' + t;
                e.textContent = m;
                $('toastContainer').appendChild(e);
                setTimeout(() => e.remove(), 2200);
            }

            function getRootVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

            function setRootVar(n, v) { document.documentElement.style.setProperty(n, v); }

            function genId() { return 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6); }

            function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

            function debounce(fn, ms) { let t; return function(...a) { clearTimeout(t);
                    t = setTimeout(() => fn.apply(this, a), ms); }; }

            // ========== IndexedDB ==========
            const DB_NAME = 'PPT_Unified_Editor';
            const DB_VERSION = 1;
            const STORE_DATA = 'modeData';
            const STORE_SECTION = 'sectionPages';
            let db = null;

            function openDB() {
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open(DB_NAME, DB_VERSION);
                    req.onupgradeneeded = (e) => {
                        const d = e.target.result;
                        if (!d.objectStoreNames.contains(STORE_DATA)) d.createObjectStore(STORE_DATA);
                        if (!d.objectStoreNames.contains(STORE_SECTION)) d.createObjectStore(STORE_SECTION);
                    };
                    req.onsuccess = (e) => { db = e.target.result;
                        resolve(db); };
                    req.onerror = (e) => reject(e.target.error);
                });
            }

            function dbPut(store, key, val) {
                return new Promise(r => { if (!db) return r();
                    db.transaction(store, 'readwrite').objectStore(store).put(val, key).onsuccess = r; });
            }

            function dbGet(store, key) {
                return new Promise(r => { if (!db) return r(null);
                    db.transaction(store, 'readonly').objectStore(store).get(key).onsuccess = (e) => r(e.target.result); });
            }

            function dbGetAll(store) {
                return new Promise(r => { if (!db) return r([]);
                    db.transaction(store, 'readonly').objectStore(store).getAll().onsuccess = (e) => r(e.target.result || []);
                });
            }

            function dbDelete(store, key) {
                return new Promise(r => { if (!db) return r();
                    db.transaction(store, 'readwrite').objectStore(store).delete(key).onsuccess = r; });
            }

            // ========== 全局状态 ==========
            let currentMode = 'cover'; // 'cover' | 'toc' | 'ending' | 'section'
            let isGeneratingPptx = false;
            let saveDebounceTimer = null;

            // 章节页多页面数据
            let sectionPages = [];
            let activeSectionPageId = null;

            // 各模式数据缓存
            const modeData = {
                cover: null,
                toc: null,
                ending: null,
                section: null
            };

            // 默认数据
            const defaultCoverData = {
                headerText: '天津xxxx公司',
                mainTitle: '工业物联网数智化赋能解决方案',

                tags: ['工业物联网', '3D数字孪生', '大数据分析', '人工智能'],
                footerTags: ['数据驱动', '洞察问题', '预测趋势', '智能决策', '科学管理'],
                mainTitleSize: 38,
                subTitleSize: 22,
                tagSize: 15,
                mainTitleColor: '#eef2f8',
                subTitleColor: '#c5cdd8',
                tagColor: '#bcc5d1',
                headerColor: '#8896a8',
                footerTagColor: '#8896a8',
                groupGap: 14,
                tagGap: 10,
                footerTagGap: 10,
                edgeMargin: 32,
                showTagBorder: true,
                tagBorderWidth: 1.5,
                tagBorderRadius: 6,
                headerSize: 14,
                footerSize: 13,
                tagsBorderColors: []
            };

            const defaultTocData = {
                headerText: '天津xxxx公司',
                tocTitleCn: '目录',
                tocTitleEn: 'CONTENTS',
                tocCards: [
                    { num: '01', cn: '项目概述', en: 'Overview' },

            // ========== 浮动颜色选择器 ==========
            let savedSelection = null;
            let savedEditableElement = null;
            let hidePickerTimeout = null;

            function saveSel() {
                const s = window.getSelection();
                if (s.rangeCount === 0 || s.isCollapsed) { savedSelection = null;
                    savedEditableElement = null; return; }
                savedSelection = s.getRangeAt(0).cloneRange();
                let n = s.anchorNode;
                while (n) { if (n.nodeType === 1 && n.isContentEditable) { savedEditableElement = n; break; } n = n.parentNode; }
            }

            function showPicker(rect) {
                clearTimeout(hidePickerTimeout);
                const picker = $('floatingColorPicker');
                picker.classList.add('active');
                const pr = picker.getBoundingClientRect();
                let top = rect.bottom + 8,
                    left = rect.left + rect.width / 2 - pr.width / 2;
                if (top + pr.height > window.innerHeight - 20) top = rect.top - pr.height - 8;
                if (left < 10) left = 10;
                if (left + pr.width > window.innerWidth - 10) left = window.innerWidth - pr.width - 10;
                picker.style.top = top + 'px';
                picker.style.left = left + 'px';
            }

            function hidePicker() {
                $('floatingColorPicker').classList.remove('active');
                savedSelection = null;
                savedEditableElement = null;
            }

            function schedHide() {
                hidePickerTimeout = setTimeout(() => {
                    if (!window.getSelection()?.toString()?.trim()) hidePicker();
                }, 400);
            }

            function applyFloatColor(c) {
                if (!savedEditableElement) {
                    const s = window.getSelection();
                    if (s.rangeCount === 0 || s.isCollapsed) return;
                    let n = s.anchorNode;
                    while (n && !(n.nodeType === 1 && n.isContentEditable)) n = n.parentNode;
                    if (!n) return;
                    savedEditableElement = n;
                    savedSelection = s.getRangeAt(0).cloneRange();
                }
                const s = window.getSelection();
                s.removeAllRanges();
                s.addRange(savedSelection);
                try { document.execCommand('foreColor', false, c); } catch (e) {}
                const tagItem = savedEditableElement?.closest?.('.tag-item');
                if (tagItem) {
                    tagItem.style.borderColor = c;
                    tagItem.setAttribute('data-border-color', c);
                }
                saveSel();
                debounceSaveAll();
            }

            function resetFloatColor() {
                if (!savedEditableElement) return;
                const s = window.getSelection();
                s.removeAllRanges();
                s.addRange(savedSelection);
                document.execCommand('removeFormat', false, null);
                const tagItem = savedEditableElement?.closest?.('.tag-item');
                if (tagItem) {
                    const globalColor = getRootVar('--tag-border-color') || '#bcc5d1';
                    tagItem.style.borderColor = globalColor;
                    tagItem.setAttribute('data-border-color', globalColor);
                }
                saveSel();
                debounceSaveAll();
            }

            // 浮动取色器事件
            $('floatingColorInput').addEventListener('input', () => applyFloatColor($('floatingColorInput').value));
            $('resetFloatingColor').addEventListener('click', function(e) { e.stopPropagation();
                resetFloatColor(); });
            $('presetColors').addEventListener('click', function(e) {
                const sw = e.target.closest('.preset-swatch');
                if (!sw) return;
                $('floatingColorInput').value = sw.dataset.color;
                applyFloatColor(sw.dataset.color);
                e.stopPropagation();
            });
            $('floatingColorPicker').addEventListener('click', e => e.stopPropagation());
            document.addEventListener('mousedown', function(e) {
                if ($('floatingColorPicker').classList.contains('active') && !$('floatingColorPicker').contains(e.target))
                    schedHide();
            });
            document.addEventListener('mouseup', function(e) {
                if ($('floatingColorPicker').contains(e.target) || $('propsPanel').contains(e.target)) return;
                setTimeout(() => {
                    const s = window.getSelection();
                    const st = s.toString().trim();
                    if (!st) return;
                    let n = s.anchorNode;
                    while (n && !(n.nodeType === 1 && n.isContentEditable)) n = n.parentNode;
                    if (!n) return;
                    saveSel();
                    showPicker(s.getRangeAt(0).getBoundingClientRect());
                    $('colorIndicator').classList.toggle('active', true);
                }, 80);
            });

            // ========== 保存/加载 ==========
            function getCurrentData() {
                const mode = currentMode;
                if (mode === 'cover') return collectCoverData();
                if (mode === 'toc') return collectTocData();
                if (mode === 'ending') return collectEndingData();
                if (mode === 'section') return collectSectionData();
                return {};
            }

            function applyCurrentData(data) {
                const mode = currentMode;
                if (mode === 'cover') applyCoverData(data);
                else if (mode === 'toc') applyTocData(data);
                else if (mode === 'ending') applyEndingData(data);
                else if (mode === 'section') applySectionData(data);
            }

            async function saveAll() {
                const data = getCurrentData();
                await dbPut(STORE_DATA, currentMode, data);
                if (currentMode === 'section') {
                    await dbPut(STORE_DATA, 'section_pages', sectionPages);
                }
            }

            function debounceSaveAll() {
                clearTimeout(saveDebounceTimer);
                saveDebounceTimer = setTimeout(saveAll, 500);
            }

            async function loadMode(mode) {
                const data = await dbGet(STORE_DATA, mode);
                if (data) {
                    modeData[mode] = data;
                    if (mode === 'section') {
                        const pages = await dbGet(STORE_DATA, 'section_pages');
                        if (pages && pages.length) {
                            sectionPages = pages;
                            if (!sectionPages.find(p => p.id === activeSectionPageId)) {
                                activeSectionPageId = sectionPages[0]?.id || null;
                            }
                        }
                    }
                    return data;
                }
                return null;
            }

            // ========== 渲染引擎 ==========
            function renderSlide() {
                const mode = currentMode;
                const content = $('slideContent');
                if (mode === 'cover') renderCover(content);
                else if (mode === 'toc') renderToc(content);
                else if (mode === 'ending') renderEnding(content);
                else if (mode === 'section') renderSection(content);
                const labels = {
                    cover: '📄 封面页 · 16:9',
                    toc: '📑 目录页 · 16:9',
                    ending: '🏁 结束页 · 16:9',
                    section: '📌 章节过渡页 · 16:9'
                };
                $('slideLabel').textContent = labels[mode] || '📄 PPT页面 · 16:9';
                $('pageTabsBar').style.display = mode === 'section' ? 'flex' : 'none';
                const titles = {
                    cover: '🎛️ 封面页属性',
                    toc: '🎛️ 目录页属性',
                    ending: '🎛️ 结束页属性',
                    section: '🎛️ 章节过渡页属性'
                };
                $('panelTitle').textContent = titles[mode] || '🎛️ 属性';
                renderProps();
                document.querySelectorAll('.mode-tab').forEach(tab => {
                    tab.classList.toggle('active', tab.dataset.mode === mode);
                });
                const hints = {
                    cover: '使用 <strong>[页眉][主标题][副标题][标签][页脚标签]</strong> 标记编辑',
                    toc: '使用 <strong>[页眉][目录中文][目录英文][章节:标号,中文,英文][页脚标签]</strong> 格式编辑',
                    ending: '使用 <strong>[页眉][主标题][副标题][电话][邮箱][页脚标签]</strong> 格式编辑',
                    section: '使用 <strong>[页眉][标号][主标题][子标题][页脚标签]</strong> 格式编辑'
                };
                $('outlineHint').innerHTML = hints[mode] || '使用标记编辑';
                bindContentEditable();
            }

            function renderProps() {
                const mode = currentMode;
                const container = $('propsContent');
                if (mode === 'cover') renderCoverProps(container);
                else if (mode === 'toc') renderTocProps(container);
                else if (mode === 'ending') renderEndingProps(container);
                else if (mode === 'section') renderSectionProps(container);
                bindPropsEvents();
            }

            // ========== 封面页 ==========
            function renderCover(container) {
                const data = modeData.cover || defaultCoverData;
                container.innerHTML = `
                    <div class="page-header"><span class="header-text" contenteditable="true" id="headerText">${data.headerText||''}</span></div>
                    <div class="center-group" id="centerGroup">
                        <div class="main-title-wrap"><span class="main-title" contenteditable="true" id="mainTitle">${data.mainTitle||''}</span></div>

                        <div class="tags-row" id="tagsRow"></div>
                    </div>
                    <div class="page-footer" id="pageFooter"></div>
                `;
                renderCoverTags(data.tags || defaultCoverData.tags, data.tagsBorderColors || []);
                renderFooterTags(data.footerTags || defaultCoverData.footerTags);
                applyCoverStyles(data);
                autoFitCoverFonts();
                unifyTagSizes();
                unifyFooterTagSizes();

            function renderCoverTags(tags, borderColors) {
                const row = $('tagsRow');
                if (!row) return;
                row.innerHTML = '';
                const globalColor = getRootVar('--tag-border-color') || '#bcc5d1';
                tags.forEach((t, i) => {
                    const el = document.createElement('span');
                    el.className = 'tag-item border-visible';
                    const bc = borderColors[i] || globalColor;
                    el.style.borderColor = bc;
                    el.setAttribute('data-border-color', bc);
                    el.innerHTML =
                        `<span class="tag-text" contenteditable="true">${t}</span><span class="tag-delete" data-idx="${i}">✕</span>`;
                    row.appendChild(el);
                });
                row.querySelectorAll('.tag-delete').forEach(b => b.addEventListener('click', function(e) {
                    e.stopPropagation();
                    deleteCoverTag(parseInt(this.getAttribute('data-idx')));
                }));
                $('tagCountDisplay') && ($('tagCountDisplay').textContent = tags.length + '个');
                applyTagBorder();
                unifyTagSizes();
            }

            function renderFooterTags(tags) {
                const row = $('pageFooter');
                if (!row) return;
                row.innerHTML = '';
                tags.forEach((t, i) => {
                    const el = document.createElement('span');
                    el.className = 'footer-tag-item';
                    el.innerHTML =
                        `<span class="footer-tag-text" contenteditable="true">${t}</span><span class="footer-tag-delete" data-idx="${i}">✕</span>`;
                    row.appendChild(el);
                });
                row.querySelectorAll('.footer-tag-delete').forEach(b => b.addEventListener('click', function(e) {
                    e.stopPropagation();
                    deleteFooterTag(parseInt(this.getAttribute('data-idx')));
                }));
                $('footerCountDisplay') && ($('footerCountDisplay').textContent = tags.length + '个');

            function collectCoverData() {
                const tags = [];
                const tagColors = [];
                $('tagsRow')?.querySelectorAll('.tag-item').forEach(el => {
                    tags.push(el.querySelector('.tag-text')?.textContent?.trim() || '');
                    tagColors.push(el.style.borderColor || el.getAttribute('data-border-color') || '#bcc5d1');
                });
                return {
                    headerText: $('headerText')?.textContent?.trim() || '',
                    mainTitle: $('mainTitle')?.textContent?.trim() || '',
                    subTitle: $('subTitle')?.textContent?.trim() || '',
                    tags: tags,
                    tagsBorderColors: tagColors,
                    footerTags: getFooterTags(),
                    mainTitleSize: parseInt($('mainTitleSize')?.value) || 38,
                    subTitleSize: parseFloat($('subTitleSize')?.value) || 22,
                    tagSize: parseFloat($('tagSize')?.value) || 15,
                    mainTitleColor: $('mainTitleColor')?.value || '#eef2f8',
                    subTitleColor: $('subTitleColor')?.value || '#c5cdd8',
                    tagColor: $('tagColorInput')?.value || '#bcc5d1',
                    headerColor: $('headerColorInput')?.value || '#8896a8',
                    footerTagColor: $('footerTagColorInput')?.value || '#8896a8',
                    groupGap: parseInt($('groupGap')?.value) || 14,
                    tagGap: parseInt($('tagGapInput')?.value) || 10,
                    footerTagGap: parseInt($('footerTagGapInput')?.value) || 10,
                    edgeMargin: parseInt($('edgeMargin')?.value) || 32,
                    showTagBorder: $('toggleTagBorder')?.checked ?? true,
                    tagBorderWidth: parseFloat($('tagBorderWidth')?.value) || 1.5,
                    tagBorderRadius: parseInt($('tagBorderRadius')?.value) || 6,
                    headerSize: parseFloat($('headerSize')?.value) || 14,
                    footerSize: parseFloat($('footerSize')?.value) || 13
                };
            }

            function applyCoverData(data) {
                if (!data) return;
                const d = data;
                if (d.headerText) $('headerText').textContent = d.headerText;
                if (d.mainTitle) $('mainTitle').textContent = d.mainTitle;
                if (d.subTitle) $('subTitle').textContent = d.subTitle;
                if (d.mainTitleSize) { $('mainTitleSize').value = d.mainTitleSize;
                    setRootVar('--main-title-size', d.mainTitleSize + 'px'); }
                if (d.subTitleSize) { $('subTitleSize').value = d.subTitleSize;
                    setRootVar('--sub-title-size', d.subTitleSize + 'px'); }
                if (d.tagSize) { $('tagSize').value = d.tagSize;
                    setRootVar('--tag-size', d.tagSize + 'px'); }
                if (d.mainTitleColor) { $('mainTitleColor').value = d.mainTitleColor;
                    setRootVar('--main-title-color', d.mainTitleColor); }
                if (d.subTitleColor) { $('subTitleColor').value = d.subTitleColor;
                    setRootVar('--sub-title-color', d.subTitleColor); }
                if (d.tagColor) { $('tagColorInput').value = d.tagColor;
                    setRootVar('--tag-color', d.tagColor);
                    setRootVar('--tag-border-color', d.tagColor); }
                if (d.headerColor) { $('headerColorInput').value = d.headerColor;
                    setRootVar('--header-color', d.headerColor); }
                if (d.footerTagColor) { $('footerTagColorInput').value = d.footerTagColor;
                    setRootVar('--footer-tag-color', d.footerTagColor); }
                if (d.groupGap) { $('groupGap').value = d.groupGap;
                    setRootVar('--group-gap', d.groupGap + 'px'); }
                if (d.tagGap) { $('tagGapInput').value = d.tagGap;
                    setRootVar('--tag-gap', d.tagGap + 'px'); }
                if (d.footerTagGap) { $('footerTagGapInput').value = d.footerTagGap;
                    setRootVar('--footer-tag-gap', d.footerTagGap + 'px'); }
                if (d.edgeMargin) { $('edgeMargin').value = d.edgeMargin;
                    setRootVar('--header-top', d.edgeMargin + 'px');
                    setRootVar('--footer-bottom', d.edgeMargin + 'px'); }
                if (d.showTagBorder !== undefined) { $('toggleTagBorder').checked = d.showTagBorder; }
                if (d.tagBorderWidth) { $('tagBorderWidth').value = d.tagBorderWidth;
                    setRootVar('--tag-border-width', d.tagBorderWidth + 'px'); }
                if (d.tagBorderRadius) { $('tagBorderRadius').value = d.tagBorderRadius;
                    setRootVar('--tag-border-radius', d.tagBorderRadius + 'px'); }
                if (d.headerSize) { $('headerSize').value = d.headerSize;
                    setRootVar('--header-size', d.headerSize + 'px'); }
                if (d.footerSize) { $('footerSize').value = d.footerSize;
                    setRootVar('--footer-size', d.footerSize + 'px'); }
                renderCoverTags(d.tags || defaultCoverData.tags, d.tagsBorderColors || []);
                renderFooterTags(d.footerTags || defaultCoverData.footerTags);
                applyTagBorder();
                updateCoverRatio();
                autoFitCoverFonts();
                unifyTagSizes();
                unifyFooterTagSizes();
            }

            function applyCoverStyles(data) {
                const d = data || {};
                if (d.mainTitleSize) setRootVar('--main-title-size', d.mainTitleSize + 'px');
                if (d.subTitleSize) setRootVar('--sub-title-size', d.subTitleSize + 'px');
                if (d.tagSize) setRootVar('--tag-size', d.tagSize + 'px');
                if (d.mainTitleColor) setRootVar('--main-title-color', d.mainTitleColor);
                if (d.subTitleColor) setRootVar('--sub-title-color', d.subTitleColor);
                if (d.tagColor) { setRootVar('--tag-color', d.tagColor);
                    setRootVar('--tag-border-color', d.tagColor); }
                if (d.headerColor) setRootVar('--header-color', d.headerColor);
                if (d.footerTagColor) setRootVar('--footer-tag-color', d.footerTagColor);
                if (d.groupGap) setRootVar('--group-gap', d.groupGap + 'px');
                if (d.tagGap) setRootVar('--tag-gap', d.tagGap + 'px');
                if (d.footerTagGap) setRootVar('--footer-tag-gap', d.footerTagGap + 'px');
                if (d.edgeMargin) { setRootVar('--header-top', d.edgeMargin + 'px');
                    setRootVar('--footer-bottom', d.edgeMargin + 'px'); }
                if (d.tagBorderWidth) setRootVar('--tag-border-width', d.tagBorderWidth + 'px');
                if (d.tagBorderRadius) setRootVar('--tag-border-radius', d.tagBorderRadius + 'px');
                if (d.headerSize) setRootVar('--header-size', d.headerSize + 'px');
                if (d.footerSize) setRootVar('--footer-size', d.footerSize + 'px');
                updateCoverRatio();
            }

            function updateCoverRatio() {
                const m = parseFloat(getRootVar('--main-title-size').replace('px', '')) || 38;
                const s = parseFloat(getRootVar('--sub-title-size').replace('px', '')) || 22;
                const t = parseFloat(getRootVar('--tag-size').replace('px', '')) || 15;
                const rs = (s / m).toFixed(2);
                const rt = (t / m).toFixed(2);
                setRootVar('--title-sub-ratio', rs);
                setRootVar('--tag-ratio', rt);
                const el = $('ratioInfo');
                if (el) el.textContent = `主标题 > 副标题(${rs}) > 标签(${rt})`;
            }

            function autoFitCoverFonts() {
                ['mainTitle', 'subTitle'].forEach(id => {
                    const el = $(id);
                    if (!el || !el.textContent.trim()) return;
                    let size = parseFloat(getRootVar('--' + (id === 'mainTitle' ? 'main' : 'sub') + '-title-size')
                        .replace('px', '')) || (id === 'mainTitle' ? 38 : 22);
                    el.style.fontSize = size + 'px';
                    el.style.whiteSpace = 'nowrap';
                    el.style.display = 'inline-block';
                    let it = 0;
                    while (el.scrollWidth > el.clientWidth && size > 10 && it < 30) { size -= 1;
                        el.style.fontSize = size + 'px';
                        it++; }
                    if (id === 'mainTitle') { setRootVar('--main-title-size', size + 'px'); if ($('mainTitleSize')) $(
                            'mainTitleSize').value = size; } else { setRootVar('--sub-title-size', size + 'px'); if ($(
                            'subTitleSize')) $('subTitleSize').value = size; }
                });
                updateCoverRatio();
            }

            function applyTagBorder() {
                const show = $('toggleTagBorder')?.checked ?? true;
                $('tagsRow')?.querySelectorAll('.tag-item').forEach(el => el.classList.toggle('border-visible', show));
            }

            function unifyTagSizes() {
                const items = $('tagsRow')?.querySelectorAll('.tag-item');
                if (!items || !items.length) return;
                let mw = 0,
                    mh = 0;
                items.forEach(el => { el.style.minWidth = '';
                    el.style.minHeight = ''; const r = el.getBoundingClientRect(); if (r.width > mw) mw = r.width; if (r
                        .height > mh) mh = r.height; });
                items.forEach(el => { el.style.minWidth = mw + 'px';
                    el.style.minHeight = mh + 'px'; });
            }

            function unifyFooterTagSizes() {
                const items = $('pageFooter')?.querySelectorAll('.footer-tag-item');
                if (!items || !items.length) return;
                let mw = 0,
                    mh = 0;
                items.forEach(el => { el.style.minWidth = '';
                    el.style.minHeight = ''; const r = el.getBoundingClientRect(); if (r.width > mw) mw = r.width; if (r
                        .height > mh) mh = r.height; });
                items.forEach(el => { el.style.minWidth = mw + 'px';
                    el.style.minHeight = mh + 'px'; });
            }

            function getFooterTags() {
                const t = [];
                $('pageFooter')?.querySelectorAll('.footer-tag-item').forEach(el => {
                    t.push(el.querySelector('.footer-tag-text')?.textContent?.trim() || '');
                });
                return t.length ? t : defaultCoverData.footerTags;
            }

            function deleteCoverTag(i) {
                const data = getCurrentData();
                const tags = data.tags || defaultCoverData.tags;
                if (tags.length <= 1) { showToast('至少保留1个标签', 'warning'); return; }
                tags.splice(i, 1);
                if (data.tagsBorderColors) data.tagsBorderColors.splice(i, 1);
                modeData.cover = data;
                renderCoverTags(tags, data.tagsBorderColors || []);
                debounceSaveAll();
                showToast('标签已删除', 'info');
            }

            function deleteFooterTag(i) {
                const tags = getFooterTags();
                if (tags.length <= 1) { showToast('至少保留1个', 'warning'); return; }
                tags.splice(i, 1);
                const data = getCurrentData();
                data.footerTags = tags;
                modeData[currentMode] = data;
                renderFooterTags(tags);
                debounceSaveAll();
                showToast('页脚标签已删除', 'info');
            }

            function addFooterTag() {
                const tags = getFooterTags();
                if (tags.length >= 10) { showToast('最多10个', 'warning'); return; }
                tags.push('新标签');
                const data = getCurrentData();
                data.footerTags = tags;
                modeData[currentMode] = data;
                renderFooterTags(tags);
                debounceSaveAll();
                showToast('已新增', 'success');
            }

            // ===== 封面属性面板 =====
            function renderCoverProps(container) {
                const d = modeData.cover || defaultCoverData;
                container.innerHTML = `
                    <div class="prop-group"><h4>🔤 字体大小</h4>
                        <div class="prop-row"><label>主标题</label><input type="number" id="mainTitleSize" value="${d.mainTitleSize||38}" min="16" max="60" step="1">px</div>

            function renderToc(container) {

                        <span class="toc-title-cn" contenteditable="true" id="tocTitleCn">${d.tocTitleCn||'目录'}</span>

                    </div>

                        <div class="toc-card-grid" id="tocCardGrid"></div>
                    </div>
                    <div class="page-footer" id="pageFooter"></div>
                `;
                renderTocCards(d.tocCards || defaultTocData.tocCards);
                renderFooterTags(d.footerTags || defaultTocData.footerTags);
                applyTocStyles(d);
                updateTocGridLayout();
                unifyFooterTagSizes();
            }

            function renderTocCards(cards) {
                const grid = $('tocCardGrid');
                if (!grid) return;
                grid.innerHTML = '';
                cards.forEach(c => {
                    const el = document.createElement('div');
                    el.className = 'toc-card';
                    el.innerHTML =
                        `<span class="toc-card-num" contenteditable="true">${c.num||''}</span><span class="toc-card-cn" contenteditable="true">${c.cn||''}</span><span class="toc-card-en" contenteditable="true">${c.en||''}</span>`;
                    grid.appendChild(el);
                });
                updateTocGridLayout();
            }

            function updateTocGridLayout() {
                const cards = getTocCards();
                const count = cards.length;
                const map = { 4: [2, 2], 6: [2, 3], 8: [2, 4], 9: [3, 3], 12: [3, 4] };
                const [rows, cols] = map[count] || [2, Math.ceil(count / 2)];
                const grid = $('tocCardGrid');
                if (grid) { grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`; grid.style.gridTemplateRows =
                        `repeat(${rows}, 1fr)`; }
                const sel = $('tocCardCount');
                if (sel) sel.value = count;
            }

            function getTocCards() {
                const cards = [];
                $('tocCardGrid')?.querySelectorAll('.toc-card').forEach(el => {
                    cards.push({
                        num: el.querySelector('.toc-card-num')?.textContent?.trim() || '',
                        cn: el.querySelector('.toc-card-cn')?.textContent?.trim() || '',
                        en: el.querySelector('.toc-card-en')?.textContent?.trim() || ''
                    });
                });
                return cards.length ? cards : defaultTocData.tocCards;
            }

                    setRootVar('--toc-num-size', d.tocNumSize + 'px'); }

                    setRootVar('--toc-en-size', d.tocEnSize + 'px'); }
                if (d.tocNumColor) { $('tocNumColor').value = d.tocNumColor;

                applyTocPanelBorder();
                updateTocFonts();
                unifyFooterTagSizes();

            function applyTocStyles(data) {
                const d = data || {};
                if (d.tocCnSize) setRootVar('--toc-cn-size', d.tocCnSize + 'px');
                if (d.tocNumSize) setRootVar('--toc-num-size', d.tocNumSize + 'px');
                if (d.tocEnSize) setRootVar('--toc-en-size', d.tocEnSize + 'px');
                if (d.tocNumColor) setRootVar('--toc-card-number-color', d.tocNumColor);
                if (d.tocCnColor) setRootVar('--toc-card-cn-color', d.tocCnColor);

            function updateTocFonts() {

            // ===== 目录属性面板 =====
            function renderTocProps(container) {

                const dividerColor = d.endingSubColor || '#c5cdd8';

                    endingMain: $('endingMain')?.textContent?.trim() || '',
                    endingSub: $('endingSub')?.textContent?.trim() || '',
                    phoneText: $('phoneText')?.textContent?.trim() || '',
                    emailText: $('emailText')?.textContent?.trim() || '',
                    footerTags: getFooterTags(),

                    endingMainColor: $('endingMainColor')?.value || '#eef2f8',

            function applyEndingData(data) {

                if (d.headerText) $('headerText').textContent = d.headerText;

                    const subColor = d.endingSubColor || '#c5cdd8';

            // ===== 修改点：applyEndingStyles 中移除 endingDividerColor =====
            function applyEndingStyles(data) {
                const d = data || {};
                if (d.endingMainSize) setRootVar('--ending-main-size', d.endingMainSize + 'px');
                if (d.endingSubSize) setRootVar('--ending-sub-size', d.endingSubSize + 'px');
                if (d.endingContactSize) setRootVar('--ending-contact-size', d.endingContactSize + 'px');
                if (d.endingMainColor) setRootVar('--ending-main-color', d.endingMainColor);
                if (d.endingSubColor) setRootVar('--ending-sub-color', d.endingSubColor);
                if (d.endingContactColor) setRootVar('--ending-contact-color', d.endingContactColor);

                const divider = document.querySelector('.ending-divider');
                if (divider) {
                    const subColor = d.endingSubColor || '#c5cdd8';
                    divider.style.background = subColor;
                }
                updateEndingRatio();

            function updateEndingRatio() {
                const m = parseFloat(getRootVar('--ending-main-size').replace('px', '')) || 40;
                const s = parseFloat(getRootVar('--ending-sub-size').replace('px', '')) || 22;
                const c = parseFloat(getRootVar('--ending-contact-size').replace('px', '')) || 16;
                setRootVar('--ending-sub-ratio', (s / m).toFixed(2));
                setRootVar('--ending-contact-ratio', (c / m).toFixed(2));
                const el = $('endingRatioInfo');
                if (el) el.textContent = `主标题 > 副标题(${(s/m).toFixed(2)}) > 联系方式(${(c/m).toFixed(2)})`;
            }

                ['endingMain', 'endingSub', 'phoneText', 'emailText'].forEach(id => {
                    const el = $(id);

                    el.style.display = 'inline-block';

                    const minSize = id === 'endingMain' ? 20 : id === 'endingSub' ? 12 : 10;

            // ========== 章节过渡页 ==========

                container.innerHTML = `

                    <div class="section-content-wrapper">

                            <div class="section-number-wrap"><span class="section-number" contenteditable="true" id="sectionNumber">${data.number||''}</span></div>

                renderSectionTabs();

            function getActiveSectionPage() {
                if (!activeSectionPageId && sectionPages.length) activeSectionPageId = sectionPages[0].id;
                return sectionPages.find(p => p.id === activeSectionPageId) || null;
            }

            function collectSectionData() {
                const page = getActiveSectionPage();
                return {
                    headerText: $('headerText')?.textContent?.trim() || '天津xxxx公司',
                    footerTags: getFooterTags(),
                    sectionNumSize: parseInt($('sectionNumSize')?.value) || 72,
                    sectionMainSize: parseFloat($('sectionMainSize')?.value) || 36,
                    sectionSubSize: parseFloat($('sectionSubSize')?.value) || 22,
                    sectionNumColor: $('sectionNumColor')?.value || '#5b9bd5',
                    sectionMainColor: $('sectionMainColor')?.value || '#d0d8e4',
                    sectionSubColor: $('sectionSubColor')?.value || '#8896a8',
                    sectionMainSubGap: parseInt($('sectionMainSubGap')?.value) || 5,
                    sectionContentMargin: parseInt($('sectionContentMargin')?.value) || 40,
                    sectionContentPadding: parseInt($('sectionContentPadding')?.value) || 34,
                    headerSize: parseFloat($('headerSize')?.value) || 14,
                    footerSize: parseFloat($('footerSize')?.value) || 13,
                    headerColor: $('headerColorInput')?.value || '#8896a8',
                    footerTagColor: $('footerTagColorInput')?.value || '#8896a8',
                    footerTagGap: parseInt($('footerTagGapInput')?.value) || 10,
                    edgeMargin: parseInt($('edgeMargin')?.value) || 32,
                    currentPageData: page?.data || defaultSectionPageData
                };
            }

            function applySectionData(data) {
                if (!data) return;
                const d = data;
                if (d.headerText) $('headerText').textContent = d.headerText;
                if (d.sectionNumSize) { $('sectionNumSize').value = d.sectionNumSize;
                    setRootVar('--section-num-size', d.sectionNumSize + 'px'); }
                if (d.sectionMainSize) { $('sectionMainSize').value = d.sectionMainSize;
                    setRootVar('--section-main-size', d.sectionMainSize + 'px'); }
                if (d.sectionSubSize) { $('sectionSubSize').value = d.sectionSubSize;
                    setRootVar('--section-sub-size', d.sectionSubSize + 'px'); }
                if (d.sectionNumColor) { $('sectionNumColor').value = d.sectionNumColor;
                    setRootVar('--section-num-color', d.sectionNumColor); }
                if (d.sectionMainColor) { $('sectionMainColor').value = d.sectionMainColor;
                    setRootVar('--section-main-color', d.sectionMainColor); }
                if (d.sectionSubColor) { $('sectionSubColor').value = d.sectionSubColor;
                    setRootVar('--section-sub-color', d.sectionSubColor); }
                if (d.sectionMainSubGap !== undefined) { $('sectionMainSubGap').value = d.sectionMainSubGap;
                    setRootVar('--section-main-sub-gap', d.sectionMainSubGap + 'px'); }
                if (d.sectionContentMargin !== undefined) { $('sectionContentMargin').value = d.sectionContentMargin;
                    setRootVar('--section-content-margin', d.sectionContentMargin + 'px 0'); }
                if (d.sectionContentPadding !== undefined) { $('sectionContentPadding').value = d.sectionContentPadding;
                    setRootVar('--section-content-padding', d.sectionContentPadding + 'px ' + d.sectionContentPadding +
                        'px'); }
                if (d.headerSize) { $('headerSize').value = d.headerSize;
                    setRootVar('--header-size', d.headerSize + 'px'); }
                if (d.footerSize) { $('footerSize').value = d.footerSize;
                    setRootVar('--footer-size', d.footerSize + 'px'); }
                if (d.headerColor) { $('headerColorInput').value = d.headerColor;
                    setRootVar('--header-color', d.headerColor); }
                if (d.footerTagColor) { $('footerTagColorInput').value = d.footerTagColor;
                    setRootVar('--footer-tag-color', d.footerTagColor); }
                if (d.footerTagGap) { $('footerTagGapInput').value = d.footerTagGap;
                    setRootVar('--footer-tag-gap', d.footerTagGap + 'px'); }
                if (d.edgeMargin) { $('edgeMargin').value = d.edgeMargin;
                    setRootVar('--header-top', d.edgeMargin + 'px');
                    setRootVar('--footer-bottom', d.edgeMargin + 'px'); }
                renderFooterTags(d.footerTags || defaultEndingData.footerTags);
                if (d.currentPageData) {
                    const page = getActiveSectionPage();
                    if (page) { page.data = d.currentPageData;
                        applySectionPageData(page.data); }
                }
                updateSectionRatio();
                autoFitSectionFonts();
                unifyFooterTagSizes();
                renderSectionTabs();
            }

            function applySectionStyles(data) {
                const d = data || {};
                if (d.sectionNumSize) setRootVar('--section-num-size', d.sectionNumSize + 'px');
                if (d.sectionMainSize) setRootVar('--section-main-size', d.sectionMainSize + 'px');
                if (d.sectionSubSize) setRootVar('--section-sub-size', d.sectionSubSize + 'px');
                if (d.sectionNumColor) setRootVar('--section-num-color', d.sectionNumColor);
                if (d.sectionMainColor) setRootVar('--section-main-color', d.sectionMainColor);
                if (d.sectionSubColor) setRootVar('--section-sub-color', d.sectionSubColor);
                if (d.sectionMainSubGap !== undefined) setRootVar('--section-main-sub-gap', d.sectionMainSubGap + 'px');
                if (d.sectionContentMargin !== undefined) setRootVar('--section-content-margin', d.sectionContentMargin +
                    'px 0');
                if (d.sectionContentPadding !== undefined) setRootVar('--section-content-padding', d.sectionContentPadding +
                    'px ' + d.sectionContentPadding + 'px');
                updateSectionRatio();
            }

            function updateSectionRatio() {
                const n = parseFloat(getRootVar('--section-num-size').replace('px', '')) || 72;
                const m = parseFloat(getRootVar('--section-main-size').replace('px', '')) || 36;
                const s = parseFloat(getRootVar('--section-sub-size').replace('px', '')) || 22;
                setRootVar('--section-main-ratio', (m / n).toFixed(2));
                setRootVar('--section-sub-ratio', (s / n).toFixed(2));
                const el = $('sectionRatioInfo');
                if (el) el.textContent = `标号 > 主标题(${(m/n).toFixed(2)}) > 子标题(${(s/n).toFixed(2)})`;
            }

            function applySectionPageData(data) {
                if (!data) return;
                if (data.number) $('sectionNumber').textContent = data.number;
                if (data.main) $('sectionMain').textContent = data.main;
                if (data.sub) $('sectionSub').textContent = data.sub;
                autoFitSectionFonts();
            }

            function autoFitSectionFonts() {
                const numEl = $('sectionNumber');
                const mainEl = $('sectionMain');
                const subEl = $('sectionSub');
                if (!numEl || !mainEl || !subEl) return;
                const minSizes = { num: 36, main: 18, sub: 12 };
                let nSize = parseFloat(getRootVar('--section-num-size').replace('px', '')) || 72;
                let mSize = parseFloat(getRootVar('--section-main-size').replace('px', '')) || 36;
                let sSize = parseFloat(getRootVar('--section-sub-size').replace('px', '')) || 22;
                const apply = (n, m, s) => { numEl.style.fontSize = n + 'px';
                    mainEl.style.fontSize = m + 'px';
                    subEl.style.fontSize = s + 'px'; };
                apply(nSize, mSize, sSize);
                let it = 0;
                while ((numEl.scrollWidth > numEl.clientWidth + 2 || mainEl.scrollWidth > mainEl.clientWidth + 2 || subEl
                        .scrollWidth > subEl.clientWidth + 2) &&
                    nSize > minSizes.num && mSize > minSizes.main && sSize > minSizes.sub && it < 40) {
                    nSize -= 1.5;
                    mSize = Math.round(nSize * (36 / 72) * 2) / 2;
                    sSize = Math.round(nSize * (22 / 72) * 2) / 2;
                    if (mSize < minSizes.main) mSize = minSizes.main;
                    if (sSize < minSizes.sub) sSize = minSizes.sub;
                    apply(nSize, mSize, sSize);
                    it++;
                }
                setRootVar('--section-num-size', nSize + 'px');
                if ($('sectionNumSize')) $('sectionNumSize').value = Math.round(nSize);
                setRootVar('--section-main-size', mSize + 'px');
                if ($('sectionMainSize')) $('sectionMainSize').value = mSize;
                setRootVar('--section-sub-size', sSize + 'px');
                if ($('sectionSubSize')) $('sectionSubSize').value = sSize;
                updateSectionRatio();
            }

            function renderSectionTabs() {
                const bar = $('pageTabsBar');
                if (!bar) return;
                bar.querySelectorAll('.page-tab').forEach(t => t.remove());
                sectionPages.forEach(page => {
                    const tab = document.createElement('div');
                    tab.className = 'page-tab' + (page.id === activeSectionPageId ? ' active' : '');
                    tab.setAttribute('data-page-id', page.id);
                    tab.innerHTML =
                        `<span class="tab-icon">📌</span><span>章节${page.data?.number||'--'}</span><span class="tab-delete" data-delete="${page.id}">✕</span>`;
                    tab.addEventListener('click', function(e) {
                        if (e.target.classList.contains('tab-delete')) { e.stopPropagation();
                            deleteSectionPage(page.id); return; }
                        switchSectionPage(page.id);
                    });
                    bar.insertBefore(tab, $('btnAddPage'));
                });
            }

            async function switchSectionPage(pageId) {
                if (pageId === activeSectionPageId) return;
                await saveCurrentSectionPage();
                const page = sectionPages.find(p => p.id === pageId);
                if (!page) return;
                activeSectionPageId = pageId;
                applySectionPageData(page.data);
                renderSectionTabs();
                debounceSaveAll();
            }

            async function saveCurrentSectionPage() {
                if (!activeSectionPageId) return;
                const page = sectionPages.find(p => p.id === activeSectionPageId);
                if (!page) return;
                page.data = {
                    number: $('sectionNumber')?.textContent?.trim() || '',
                    main: $('sectionMain')?.textContent?.trim() || '',
                    sub: $('sectionSub')?.textContent?.trim() || ''
                };
                await dbPut(STORE_SECTION, activeSectionPageId, page);
            }

            async function createSectionPage() {
                await saveCurrentSectionPage();
                const maxNum = Math.max(0, ...sectionPages.map(p => parseInt(p.data?.number) || 0));
                const newNum = String(maxNum + 1).padStart(2, '0');
                const newId = genId();
                const newPage = { id: newId, data: { number: newNum, main: '新章节标题', sub: 'New Chapter Subtitle' } };
                sectionPages.push(newPage);
                await dbPut(STORE_SECTION, newId, newPage);
                activeSectionPageId = newId;
                applySectionPageData(newPage.data);
                renderSectionTabs();
                showToast('已创建新章节：章节' + newNum, 'success');
                debounceSaveAll();
            }

            async function deleteSectionPage(pageId) {
                if (sectionPages.length <= 1) { showToast('至少保留一个页面', 'warning'); return; }
                const idx = sectionPages.findIndex(p => p.id === pageId);
                if (idx === -1) return;
                await dbDelete(STORE_SECTION, pageId);
                sectionPages.splice(idx, 1);
                if (pageId === activeSectionPageId) {
                    const newActive = sectionPages[Math.min(idx, sectionPages.length - 1)];
                    activeSectionPageId = newActive.id;
                    applySectionPageData(newActive.data);
                }
                renderSectionTabs();
                showToast('页面已删除', 'info');
                debounceSaveAll();
            }

            // ===== 章节属性面板 =====
            function renderSectionProps(container) {

                container.innerHTML = `

                        <div class="prop-row"><label>主标题</label><input type="number" id="sectionMainSize" value="${d.sectionMainSize||36}" min="18" max="52" step="0.5">px</div>
                        <div class="prop-row"><label>子标题</label><input type="number" id="sectionSubSize" value="${d.sectionSubSize||22}" min="12" max="34" step="0.5">px</div>

                    </div>

                        <div class="prop-row"><label>内容栏上下边距</label><input type="number" id="sectionContentMargin" value="${d.sectionContentMargin||40}" min="16" max="80" step="2">px</div>

            // ========== 属性面板事件绑定 ==========
            function bindPropsEvents() {
                const mode = currentMode;

                const headerSize = $('headerSize');
                const footerSize = $('footerSize');
                const headerColor = $('headerColorInput');
                const footerTagColor = $('footerTagColorInput');
                const footerTagGap = $('footerTagGapInput');
                const edgeMargin = $('edgeMargin');

                if (headerSize) headerSize.oninput = function() {
                    const v = clamp(parseFloat(this.value) || 14, 8, 24);
                    this.value = v;
                    setRootVar('--header-size', v + 'px');

                };
                if (footerSize) footerSize.oninput = function() {
                    const v = clamp(parseFloat(this.value) || 13, 8, 22);

                    setRootVar('--footer-size', v + 'px');
                    unifyFooterTagSizes();
                    debounceSaveAll();

                if (footerTagColor) footerTagColor.oninput = function() { setRootVar('--footer-tag-color', this.value);

            // 封面属性绑定
            function bindCoverProps() {
                const mainSize = $('mainTitleSize');
                const subSize = $('subTitleSize');
                const tagSize = $('tagSize');
                const mainColor = $('mainTitleColor');
                const subColor = $('subTitleColor');
                const tagColor = $('tagColorInput');
                const groupGap = $('groupGap');
                const tagGap = $('tagGapInput');
                const toggleBorder = $('toggleTagBorder');
                const borderWidth = $('tagBorderWidth');
                const borderRadius = $('tagBorderRadius');
                const addTagBtn = $('addCoverTagBtn');

                if (mainSize) mainSize.oninput = function() {
                    let v = clamp(parseInt(this.value) || 38, 16, 60);
                    this.value = v;
                    setRootVar('--main-title-size', v + 'px');
                    const rs = 0.58,
                        rt = 0.39;
                    const sv = Math.round(v * rs * 2) / 2;
                    const tv = Math.round(v * rt * 2) / 2;
                    if (subSize) { subSize.value = sv;
                        setRootVar('--sub-title-size', sv + 'px'); }
                    if (tagSize) { tagSize.value = tv;
                        setRootVar('--tag-size', tv + 'px'); }
                    updateCoverRatio();
                    autoFitCoverFonts();
                    unifyTagSizes();
                    debounceSaveAll();
                };
                if (subSize) subSize.oninput = function() {
                    let v = clamp(parseFloat(this.value) || 22, 10, 40);
                    this.value = v;
                    setRootVar('--sub-title-size', v + 'px');
                    updateCoverRatio();
                    autoFitCoverFonts();
                    debounceSaveAll();
                };
                if (tagSize) tagSize.oninput = function() {
                    let v = clamp(parseFloat(this.value) || 15, 8, 30);
                    this.value = v;
                    setRootVar('--tag-size', v + 'px');
                    updateCoverRatio();
                    unifyTagSizes();
                    debounceSaveAll();
                };
                if (mainColor) mainColor.oninput = function() { setRootVar('--main-title-color', this.value);
                    debounceSaveAll(); };
                if (subColor) subColor.oninput = function() { setRootVar('--sub-title-color', this.value);
                    debounceSaveAll(); };
